<!DOCTYPE html>
<html>
  <head>
    <title>Scribbles</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Henny+Penny&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" type="text/css" href="style.css" />
    <link rel="icon" type="image/x-icon" href="/images/favicon.ico" />
    <script src="lib/p5.min.js"></script>
    <script src="lib/p5.dom.js"></script>

    <script src="sketch.js"></script>
    <!-- add extra scripts below -->
    <script src="./components/toolbox.js"></script>
    <script src="./components/colourPalette.js"></script>
    <script src="./components/helperFunctions.js"></script>
    <script src="./components/tools/freehandTool.js"></script>
    <script src="./components/tools/lineToTool.js"></script>
    <script src="./components/tools/mirrorDrawTool.js"></script>
    <script src="./components/tools/sprayCanTool.js"></script>
    <script src="./components/tools/rectangleTool.js"></script>
  </head>
  <body>
    <div class="wrapper">
      <div class="box header">
        <h1>Scribbles</h1>
      </div>

      <div class="box menu">
        <button id="clearButton">Clear</button>
        <button id="saveImageButton">Save Image</button>
      </div>

      <div class="box colours">
        <div class="colourSamples"></div>
        <div class="colourPalette"></div>
        <div class="colourPicker">
          <p id="colourWheel">
            <!-- <input type="color" /> -->
            <!-- <button></button> -->
          </p>
          <p id="opacityInput">
            <!-- <label for="opacity">Opacity:</label>
            <input type="number" id="opacity" min="0" max="100" /> % -->
          </p>
        </div>
      </div>

      <div class="box options"></div>

      <div class="box sidebar"></div>

      <div id="content"></div>
    </div>
  </body>
</html>
